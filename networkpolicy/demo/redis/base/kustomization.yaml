apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: database

resources:
- deployment.yaml
- service.yaml
- serviceaccount.yaml
- namespace.yaml
- policy.yaml

configMapGenerator:
- name: redis-config
  literals:
  - ALLOW_EMPTY_PASSWORD=yes
  - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
