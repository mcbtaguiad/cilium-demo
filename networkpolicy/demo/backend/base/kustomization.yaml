apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: backend

resources:
- deployment.yaml
- service.yaml
- namespace.yaml
- route.yaml
- serviceaccount.yaml
- policy.yaml


configMapGenerator:
- name: backend-config
  literals:
  - VERSION=cilium_demo
  - ALLOWED_HOSTS=http://192.168.254.230
  - REDIS_ADDR=redis.database.svc.cluster.local:6379
